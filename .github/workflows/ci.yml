name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv
      - name: Install dependencies
        run: uv sync --locked
      - name: Test
        run: uv run python -m unittest discover -s tests -v
      - name: Compile
        run: uv run python -m compileall -q server.py scheduler_service.py hub_cli.py utils scripts
      - name: Check documentation links
        run: uv run python scripts/check_docs.py
      - name: Public release audit
        run: uv run python scripts/audit_public.py
